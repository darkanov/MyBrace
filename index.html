services:()=>`<div class="w page"><h1>Ортодонтія, яка починається з консультації</h1><p class="lead">Наявність послуг у MyBrace клініка підтверджує окремо. Тривалість і результат лікування визначає лікар індивідуально.</p>${S.map(x=>`<article class="svc"><div><h2 style="font-size:28px">${x.n}</h2><p class="sub" style="margin:0">${x.d}</p></div><div><h4>Кому може бути актуально</h4><p>${x.who}</p><h4>Що уточнити у лікаря</h4><p>${x.ask}</p><h4>Вартість</h4><p>Вартість уточнюється</p><p style="margin-top:18px"><a class="btn" href="#zapys">Записатися на консультацію</a></p></div></article>`).join('')}<p class="sub" style="margin-top:20px">Інші ортодонтичні послуги з’являться тут після підтвердження клінікою.</p></div>`,
team:()=>`<div class="w page"><h1>Команда MyBrace</h1><p class="lead">Імена, фото, освіта та кваліфікація лікарів будуть додані після отримання даних від клініки.</p><div class="grid">${D.map(()=>`<div class="card ph"><div class="face">Фото та інформацію буде додано</div><h3>Ім’я лікаря</h3><p>Спеціалізація, освіта та коротка біографія — після підтвердження.</p></div>`).join('')}</div><p style="margin-top:36px"><a class="btn" href="#zapys">Записатися на консультацію</a></p></div>`,
prices:()=>`<div class="w page"><h1>Ціни</h1><p class="lead">Індивідуальний план і остаточна вартість визначаються після консультації та діагностики. Суми додамо після отримання прайсу.</p><div class="grid" style="margin-top:28px">${P.map(g=>`<div class="card"><h3>${g[0]}</h3>${g[1].map(i=>`<div class="pr"><span>${i}</span><span>Вартість уточнюється</span></div>`).join('')}</div>`).join('')}</div><p style="margin-top:36px"><a class="btn" href="#zapys">Дізнатися вартість на консультації</a></p></div>`,
contacts:()=>`<div class="w page"><h1>Контакти</h1><div class="cols" style="margin-top:28px"><div class="box"><dl><dt>Адреса</dt><dd>${ADDR}</dd><dt>Телефон</dt><dd><a href="tel:${PHONE}">${PHONE_T}</a></dd><dt>Години роботи</dt><dd>Уточнюйте за телефоном</dd></dl><p style="margin:24px 0 0"><a class="btn o" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ADDR)}" target="_blank" rel="noopener">Відкрити пошук на мапі</a></p><p class="sub" style="margin:14px 0 0;font-size:14px">Інтерактивну карту підключимо після підтвердження адреси.</p></div>${fh('fc')}</div></div>`,
privacy:()=>`<div class="w page"><h1>Політика конфіденційності</h1><p class="lead">Повний текст буде надано власником клініки. У формі збираються лише ім’я, телефон і за бажанням послуга та зручний час — для зв’язку щодо консультації.</p></div>`,
nf:()=>`<div class="w page"><h1>Сторінку не знайдено</h1><p class="lead">Перевірте адресу або поверніться на головну.</p><a class="btn" href="#home">На головну</a></div>`};
const app=document.getElementById('app'),nav=document.getElementById('nav'),bg=document.getElementById('bg');let cur='';
function route(){const h=location.hash.slice(1)||'home',k=h==='zapys'?'home':(V[h]&&h!=='nf'?h:'nf');
if(k!==cur){app.innerHTML=V[k]();cur=k;document.title=T[k];nav.innerHTML=NAV.map(a=>`<a href="#${a[0]}"${a[0]===k?' aria-current="page"':''}>${a[1]}</a>`).join('');}
nav.classList.remove('open');bg.setAttribute('aria-expanded','false');
if(h==='zapys'){const f=document.getElementById('bk');f&&f.scrollIntoView();const i=document.querySelector('#fh input');i&&i.focus({preventScroll:true})}else{window.scrollTo(0,0);app.focus({preventScroll:true})}}
addEventListener('hashchange',route);route();
bg.onclick=()=>bg.setAttribute('aria-expanded',nav.classList.toggle('open'));
const ph=v=>{let d=v.replace(/\D/g,'');if(d.startsWith('380'))d=d.slice(3);else if(d.startsWith('0'))d=d.slice(1);return /^\d{9}$/.test(d)?'+380'+d:null};
document.addEventListener('submit',async e=>{const f=e.target;if(!f.matches('form.box'))return;e.preventDefault();
const id=f.id,q=n=>f.elements[n],set=(n,t)=>{document.getElementById(id+'-e'+n).textContent=t||'';const el=n==='c'?q('c'):q(n==='n'?'n':'p');el.setAttribute('aria-invalid',t?'true':'false')},m=f.querySelector('.msg'),b=f.querySelector('button');
m.className='msg';m.textContent='';
const name=q('n').value.trim(),tel=ph(q('p').value),ok=q('c').checked;
set('n',name.length<2?'Вкажіть ім’я.':'');set('p',tel?'':'Вкажіть український номер, наприклад +380 98 309 90 99.');set('c',ok?'':'Потрібна згода на обробку даних.');
if(name.length<2||!tel||!ok){f.querySelector('[aria-invalid=true]').focus();return}
if(!ENDPOINT){m.className='msg err';m.textContent='Надсилання заявок ще не підключено, тому дані не відправлено. Зателефонуйте: '+PHONE_T+'.';return}
b.disabled=true;b.textContent='Надсилаємо…';
try{const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,phone:tel,service:q('s').value,time:q('t').value.trim()})});
if(!r.ok)throw 0;m.textContent='Заявку надіслано. З вами зв’яжуться для узгодження консультації.';f.reset()}
catch(_){m.className='msg err';m.textContent='Не вдалося надіслати заявку. Спробуйте ще раз або зателефонуйте: '+PHONE_T+'.'}
b.disabled=false;b.textContent='Надіслати заявку'});
</script></body></html>
